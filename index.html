<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ad-motsuの個人制作・公開ページ一覧ポータル。">
<meta property="og:title" content="ad-motsu pages">
<meta property="og:description" content="ad-motsuの個人制作・公開ページ一覧ポータル。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ad-motsu.github.io/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ad-motsu pages</title>
<style>
:root {
  --bg: #fbfbfa;
  --card-bg: #ffffff;
  --ink: #18181b;
  --muted: #52525b;
  --rule: #e4e4e7;
  --tag-bg: #f4f4f5;
  --tag-ink: #3f3f46;
  --badge-wip-bg: #fef3c7;
  --badge-wip-ink: #92400e;
  --link: #1d4ed8;
  --card-hover-border: #a1a1aa;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214;
    --card-bg: #18181b;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --rule: #27272a;
    --tag-bg: #27272a;
    --tag-ink: #e4e4e7;
    --badge-wip-bg: #451a03;
    --badge-wip-ink: #fde68a;
    --link: #60a5fa;
    --card-hover-border: #52525b;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans JP", sans-serif;
  color: var(--ink);
  background-color: var(--bg);
  line-height: 1.6;
  font-size: 15px;
  padding: 0 20px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.wrap {
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  flex: 1 0 auto;
}

header {
  padding: 48px 0 28px;
  border-bottom: 1px solid var(--rule);
}

h1 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.lead {
  margin-top: 6px;
  color: var(--muted);
  font-size: 14px;
}

.list {
  list-style: none;
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 20px 22px;
  transition: border-color 0.15s ease;
}

.card:hover {
  border-color: var(--card-hover-border);
}

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
}

a.card-title-link {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}

a.card-title-link:hover {
  color: var(--link);
  border-bottom-color: var(--link);
}

a.card-title-link:focus-visible, a:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 3px;
}

.badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}

.badge-wip {
  background: var(--badge-wip-bg);
  color: var(--badge-wip-ink);
}

.card-summary {
  margin-top: 8px;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--muted);
}

.tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tag {
  background: var(--tag-bg);
  color: var(--tag-ink);
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 11.5px;
}

.card-date {
  font-variant-numeric: tabular-nums;
}

footer {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}

footer a {
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 2px;
}

footer a:hover {
  color: var(--ink);
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ad-motsu pages</h1>
    <p class="lead">制作・公開しているページの一覧</p>
  </header>
  <main>
    <ul class="list" id="page-list"></ul>
  </main>
  <footer>
    <a href="https://github.com/ad-motsu/ad-motsu.github.io" target="_blank" rel="noopener">GitHub: ad-motsu/ad-motsu.github.io</a>
  </footer>
</div>

<script>
const PAGES = [
  {
    name: "Circle Ops Tracker",
    href: "comiket/",
    summary: "コミケ参加・手続き進行表。申込から当日までの締切カウントダウンと、当落後・当日のチェックリスト。",
    tags: ["同人", "コミケ", "メモ"],
    updated: "2026-08-17",
    status: "public"
  }
];

(function(){
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const listEl = document.getElementById('page-list');
  if (!listEl) return;

  listEl.innerHTML = PAGES.filter(Boolean).map(p => {
    const isWip = p.status === 'wip';
    const titleHtml = isWip
      ? `<span class="card-title">${esc(p.name)}</span>`
      : `<a href="${esc(p.href || '')}" class="card-title-link card-title">${esc(p.name)}</a>`;

    const badgeHtml = isWip
      ? `<span class="badge badge-wip">準備中</span>`
      : '';

    const tagsHtml = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');

    return `<li class="card">
      <div class="card-head">
        ${titleHtml}
        ${badgeHtml}
      </div>
      ${p.summary ? `<p class="card-summary">${esc(p.summary)}</p>` : ''}
      <div class="card-foot">
        <div class="tags">${tagsHtml}</div>
        ${p.updated ? `<div class="card-date">更新: ${esc(p.updated)}</div>` : ''}
      </div>
    </li>`;
  }).join('');
})();
</script>
</body>
</html>

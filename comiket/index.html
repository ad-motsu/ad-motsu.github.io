      at: null                            ← 未定（日程未定と表示される）

  日時は +09:00（日本時間）を付けます。
  「消印有効」など時刻がないものは、その日の 23:59:59 にします。

  【PDFが公開されたら】
  各項目の pdf: の url を書き換えます。空のままだと「公開待ち」と表示。
  PDFのURLは回ごとに変わりますが、check（確認先）は変わりません。

  タブは URL で切り替わります → #usual / #first / #onsite
==================================================================

<style>
:root{
  --ink:#1a1a5c; --paper:#eceaf3; --card:#f8f7fc; --rule:#c2c1eb;
  --muted:#45447f; --stamp:#d10000; --indigo:#3d3c8f; --seal:#000066;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);
  background-color:var(--paper);
  background-image:
    /* deslop-ignore-next-line 06: 原稿用紙の升目。同人誌の文脈を示す意図的な選択 */
    repeating-linear-gradient(0deg,rgba(26,26,92,.045) 0 1px,transparent 1px 34px),
    /* deslop-ignore-next-line 06: 原稿用紙の升目。同人誌の文脈を示す意図的な選択 */
    repeating-linear-gradient(90deg,rgba(26,26,92,.045) 0 1px,transparent 1px 34px);
  line-height:1.75;font-size:15px;padding:0 18px 80px;
}
.wrap{max-width:760px;margin:0 auto}
a{color:var(--indigo);text-decoration:none;border-bottom:1px solid rgba(61,60,143,.35)}
a:hover{border-bottom-color:var(--indigo)}
a:focus-visible,button:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}

.stale{background:var(--stamp);color:#fff;font-size:13px;font-weight:500;
  padding:10px 16px;margin:0 -18px;text-align:center}

.disclaimer{border:1px solid var(--stamp);background:rgba(209,0,0,.05);
  padding:11px 14px;margin-top:20px;font-size:12.5px;line-height:1.65;color:var(--stamp)}
.disclaimer b{font-weight:700}

header{padding:40px 0 26px}
h1{font-family:"Shippori Mincho B1",serif;font-weight:600;
  font-size:clamp(26px,6vw,36px);line-height:1.25;margin:8px 0 4px}
.subtitle{font-size:13.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:12px;color:var(--muted)}
.meta b{font-weight:500;color:var(--ink)}

.tabs{display:flex;border-bottom:2px solid var(--ink);margin-top:30px;align-items:stretch}
.tab{font-family:"Noto Sans JP",sans-serif;font-size:14.5px;font-weight:500;
  background:none;cursor:pointer;color:var(--muted);padding:13px 22px;
  position:relative;top:2px;line-height:1.4;
  border:1px solid transparent;border-bottom:none;
  display:inline-flex;align-items:center;justify-content:center}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;background:var(--card);
  border-color:var(--ink);border-bottom:2px solid var(--card)}
.panel[hidden]{display:none}

.hero{position:relative;background:var(--card);border:2px solid var(--ink);
  margin:44px 0 18px;padding:30px 26px 26px}
.hero.is-urgent{border-color:var(--stamp)}
.tombo{position:absolute;width:20px;height:20px;pointer-events:none}
.tombo::before,.tombo::after{content:"";position:absolute;background:var(--rule)}
.tombo::before{left:50%;top:0;bottom:0;width:1px}
.tombo::after{top:50%;left:0;right:0;height:1px}
.tombo.tl{left:-11px;top:-11px}.tombo.tr{right:-11px;top:-11px}
.tombo.bl{left:-11px;bottom:-11px}.tombo.br{right:-11px;bottom:-11px}
.hero-label{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted)}
.hero-name{font-size:18px;font-weight:700;margin:6px 0 2px;line-height:1.4}
.hero-when{font-size:13px;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:10px;margin-top:18px;flex-wrap:wrap}
.count-num{font-family:"Oswald",sans-serif;font-weight:600;
  font-size:clamp(64px,17vw,116px);line-height:.86;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.is-urgent .count-num{color:var(--stamp)}
.count-unit{font-size:20px;font-weight:500;transform:translateY(-6px)}
.count-sub{font-family:"Oswald",sans-serif;font-size:13px;letter-spacing:.06em;
  color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.hero-note{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--muted)}

h2{font-family:"Oswald",sans-serif;font-weight:400;font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin:48px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.lead{font-size:14.5px;margin-top:24px}

.row{display:flex;gap:16px;align-items:flex-start;padding:16px 0;
  border-bottom:1px solid var(--rule)}
.row-date{flex:0 0 74px;font-family:"Oswald",sans-serif;font-size:12px;
  letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums;
  padding-top:3px;line-height:1.5}
.row-date b{display:block;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:0}
.row-date b.undec{display:inline-block;font-size:12px;font-weight:400;color:var(--muted)}
.row-body{flex:1 1 auto;min-width:0}
.row-name{font-weight:500;font-size:15px;line-height:1.5}
.row-note{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.row-left{flex:0 0 auto;text-align:right;font-family:"Oswald",sans-serif;font-size:12px;
  letter-spacing:.05em;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums}
.row-left b{font-size:22px;font-weight:600;color:var(--ink);display:block;line-height:1.1}
.row.urgent .row-left b,.row.urgent .row-date b{color:var(--stamp)}
.row.done{opacity:.5}
/* deslop-ignore-next-line 09: 終了した締切の取り消し。装飾ではなく状態表示 */
.row.done .row-name{text-decoration:line-through;text-decoration-thickness:1px}
.stampmark{flex:0 0 auto;width:54px;height:54px;color:var(--seal);opacity:.75;
  transform:rotate(-11deg);align-self:center}
@media(prefers-reduced-motion:no-preference){
  .stampmark{animation:press .5s cubic-bezier(.2,.9,.3,1) both}}
@keyframes press{from{transform:rotate(-11deg) scale(1.5);opacity:0}
  to{transform:rotate(-11deg) scale(1);opacity:.75}}

.links{list-style:none}
.links li{padding:12px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.links li.pin .row-note{color:var(--seal)}
.links li.pin a{font-weight:700}
.host{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:.09em;
  color:var(--muted);margin-top:3px}
.check{list-style:none;font-size:14px}
.check li{padding:9px 0 9px 26px;position:relative;border-bottom:1px dotted var(--rule)}
.check li::before{content:"";position:absolute;left:0;top:15px;
  width:12px;height:12px;border:1px solid var(--ink)}

/* 当選後にやること */
.tasks{list-style:none;counter-reset:tk}
.tasks li{counter-increment:tk;position:relative;padding:20px 0 20px 52px;
  border-bottom:1px solid var(--rule)}
.tasks li::before{content:counter(tk,decimal-leading-zero);position:absolute;
  left:0;top:21px;font-family:"Oswald",sans-serif;font-size:20px;font-weight:600;
  color:var(--seal);letter-spacing:-.02em}
.tk-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tk-name{font-weight:700;font-size:15.5px;line-height:1.5}
.badge{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:.1em;
  padding:2px 8px;border:1px solid var(--muted);color:var(--muted);white-space:nowrap}
.badge.set{border-color:var(--muted);color:var(--muted);font-weight:600}
/* deslop-ignore-next-line 09: 終了した締切の取り消し。装飾ではなく状態表示 */
.badge.done{opacity:.5;text-decoration:line-through}
.tk-meta{display:grid;grid-template-columns:64px 1fr;gap:5px 12px;
  margin:10px 0;font-size:12.5px;line-height:1.6}
.tk-k{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:.12em;
  color:var(--muted);padding-top:3px}
.tk-note{font-size:13.5px;color:var(--muted);line-height:1.8}
.tk-note.is-warn{color:var(--stamp)}
.tk-files{margin-top:11px;padding-top:10px;border-top:1px dotted var(--rule);font-size:13px}
.tk-files div{margin-top:3px}
.tk-files .lbl{font-family:"Oswald",sans-serif;font-size:10px;letter-spacing:.12em;
  color:var(--muted);margin-right:7px}
.pending{color:var(--muted);font-size:12.5px}

.row-src{margin-top:4px}
.row-src a{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:.1em;
  color:var(--muted);border-bottom-color:var(--rule)}
.row-src a:hover{color:var(--indigo)}

.pending-row{border-bottom-style:dashed}
.pending-row .row-name{font-weight:400;color:var(--muted)}
.undec{font-family:"Noto Sans JP",sans-serif;font-size:12px;font-weight:400;
  letter-spacing:.1em;color:var(--muted);border:1px solid var(--rule);
  padding:1px 7px;display:inline-block}

.check.none li::before{border-style:dashed;opacity:.5}
.check.none li{color:var(--muted)}

.rule-pat{background:var(--card);border:1px solid var(--rule);padding:12px 14px;
  font-family:"Oswald",sans-serif;font-size:13px;letter-spacing:.04em;
  word-break:break-all;margin-bottom:6px}
.rule-k{font-family:"Oswald",sans-serif;font-size:13.5px;letter-spacing:.03em;
  color:var(--stamp);font-weight:600}

footer{margin-top:56px;padding-top:20px;border-top:2px solid var(--ink);
  font-size:12px;color:var(--muted)}

@media(max-width:520px){
  .tab{padding:10px 4px;font-size:12.5px;flex:1 1 0;text-align:center;line-height:1.3}
  .row{flex-wrap:wrap;gap:10px}
  .row-date{flex-basis:100%;display:flex;align-items:baseline;gap:8px}
  .row-date b{display:inline}
  .row-body{flex-basis:100%;order:3}
  .row-left{order:2;margin-left:auto}
  .stampmark{order:4;width:44px;height:44px}
  .tasks li{padding-left:40px}
}
</style>
</head>

<div id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  if (!app) return;

  try {
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const pad = n => String(n).padStart(2,'0');
    const now0 = new Date();
    /* URL中の {n} を回数に置き換える */
    const R = u => String(u || "").replace(/\{n\}/g, (DATA.event && DATA.event.no) || "");

    const getHost = u => {
      try {
        return u ? new URL(R(u)).hostname : "";
      } catch (_) {
        return "";
      }
    };

    /* 申込の締切 ＋ 当選後の申請のうち日程が確定したもの を合流 */
    const fromAfter = ((DATA.after && DATA.after.items) || [])
      .filter(x => x && x.at)
      .map(x => ({ name: x.name, at: x.at, note: x.how, src: R((x.check && x.check.url) || "") }));
    const items = [...(DATA.deadlines || []), ...fromAfter]
      .filter(d => d && d.at)
      .map(d => ({ ...d, t: new Date(d.at) }))
      .sort((a, b) => a.t - b.t);

    const next = items.find(i => i.t > now0);
    const fmtDate = d => `${d.getMonth()+1}/${d.getDate()}`;
    const fmtFull = d => {
      const w = "日月火水木金土"[d.getDay()];
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}） ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const daysLeft = t => Math.ceil((t - new Date()) / 86400000);

    const stampSVG = `<svg class="stampmark" viewBox="0 0 100 100" aria-hidden="true">
      <!-- deslop-ignore-next-line 24: 判子（済スタンプ）の意匠。汎用アイコンではない -->
      <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/>
      <!-- deslop-ignore-next-line 24: 判子（済スタンプ）の意匠。汎用アイコンではない -->
      <circle cx="50" cy="50" r="39" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="50" y="59" text-anchor="middle" font-family="'Shippori Mincho B1',serif"
            font-size="30" font-weight="600" fill="currentColor">終了</text></svg>`;

    /* ---------- ヘッダー ---------- */
    let html = "";
    const daysOld = Math.floor((now0 - new Date(DATA.updated)) / 86400000);
    if (!next) html += `<div class="stale">全ての日程が過ぎています。次回の情報に更新してください</div>`;
    else if (daysOld > 120) html += `<div class="stale">最終更新から${daysOld}日経過。公式ページで締切を確認してください</div>`;

    html += `<header>
      <h1>${esc(DATA.title)}</h1>
      <div class="subtitle"><b>${esc(DATA.event && DATA.event.name)}</b>　${esc(DATA.event && DATA.event.dates)}</div>
      <div class="meta">
        <span>会場 <b>${esc(DATA.event && DATA.event.venue)}</b></span>
        <span>参加費 <b>${esc(DATA.event && DATA.event.fee)}</b></span>
        <span>データ更新 <b>${esc(DATA.updated)}</b></span>
      </div>
      <div class="disclaimer">
        <b>非公式の個人メモです。</b>コミックマーケット準備会とは関係ありません。
        日付は手作業で転記したもので、誤りが含まれる可能性があります。
        申し込む前に必ず<a href="https://www.comiket.co.jp/" target="_blank" rel="noopener">公式サイト</a>で確認してください。
      </div>
    </header>`;

    html += `<div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-usual" aria-controls="panel-usual" aria-selected="true">締切一覧</button>
      <button class="tab" role="tab" id="tab-first" aria-controls="panel-first" aria-selected="false">当選後にやること</button>
      <button class="tab" role="tab" id="tab-onsite" aria-controls="panel-onsite" aria-selected="false">当日やること</button>
    </div>`;

    /* ---------- パネル1 ---------- */
    let u = `<div class="panel" id="panel-usual" role="tabpanel" aria-labelledby="tab-usual">`;
    if (next) {
      u += `<section class="hero" id="hero">
        <span class="tombo tl"></span><span class="tombo tr"></span>
        <span class="tombo bl"></span><span class="tombo br"></span>
        <div class="hero-label">Next deadline</div>
        <div class="hero-name">${esc(next.name)}</div>
        <div class="hero-when">${fmtFull(next.t)}</div>
        <div class="count"><span class="count-num" id="cnum">–</span><span class="count-unit" id="cunit">日</span></div>
        <div class="count-sub" id="csub"></div>
        ${next.note ? `<div class="hero-note">${esc(next.note)}</div>` : ""}
      </section>`;
    } else {
      u += `<section class="hero">
        <span class="tombo tl"></span><span class="tombo tr"></span>
        <span class="tombo bl"></span><span class="tombo br"></span>
        <div class="hero-label">Next deadline</div>
        <div class="hero-name">予定なし</div>
        <div class="hero-when">次回の日程が発表されたら DATA を書き換えてください</div>
      </section>`;
    }

    u += `<h2>すべての日程</h2>`;

    const rows = items.map(i => {
      const past = i.t <= now0, left = daysLeft(i.t), urgent = !past && left <= 3;
      return `<div class="row ${past?'done':''} ${urgent?'urgent':''}">
        <div class="row-date"><b>${fmtDate(i.t)}</b>${pad(i.t.getHours())}:${pad(i.t.getMinutes())}</div>
        <div class="row-body"><div class="row-name">${esc(i.name)}</div>
          ${i.note?`<div class="row-note">${esc(i.note)}</div>`:""}
          ${i.src?`<div class="row-src"><a href="${esc(R(i.src))}" target="_blank" rel="noopener">出典を見る</a></div>`:""}</div>
        ${past ? stampSVG : `<div class="row-left"><b>${left}</b>日</div>`}
      </div>`;
    });

    /* 日程が未定の申請も、申込の締切と開催日のあいだに並べる。
       at が入った時点で上の rows 側に移り、日付順に整列する。 */
    const pendingRows = ((DATA.after && DATA.after.items) || [])
      .filter(x => x && !x.at)
      .map(x => `
      <div class="row pending-row">
        <div class="row-date"><b class="undec">未定</b></div>
        <div class="row-body">
          <div class="row-name">${esc(x.name)}</div>
          <div class="row-note">${esc(x.when)}</div>
          ${(x.check && x.check.url) ? `<div class="row-src">
            <a href="${esc(R(x.check.url))}" target="_blank" rel="noopener">確認先を見る</a></div>` : ""}
        </div>
        <div class="row-left"></div>
      </div>`);

    if (pendingRows.length) {
      let at = items.findIndex(i => i.kind === "event");
      if (at < 0) at = rows.length;
      rows.splice(at, 0, ...pendingRows);
    }
    u += rows.join("");

    const groups = [];
    (DATA.links || []).forEach(l => {
      if (!l) return;
      const g = l.group || "リンク";
      let x = groups.find(y => y.name === g);
      if (!x) { x = {name:g, items:[]}; groups.push(x); }
      x.items.push(l);
    });
    groups.forEach(g => {
      u += `<h2>${esc(g.name)}</h2><ul class="links">`;
      g.items.forEach(l => {
        const host = getHost(l.url);
        const isPin = l.note && String(l.note).startsWith("★");
        u += `<li${isPin ? ' class="pin"' : ''}>
          <a href="${esc(R(l.url))}" target="_blank" rel="noopener">${esc(l.name)}</a>
          ${l.note ? `<div class="row-note">${esc(l.note)}</div>` : ""}
          ${host ? `<div class="host">${esc(host)}</div>` : ""}</li>`;
      });
      u += `</ul>`;
    });

    u += `<h2>ログインに要るもの</h2><ul class="check">`;
    (DATA.keys || []).forEach(k => u += `<li>${esc(k)}</li>`);
    u += `</ul><h2>更新するとき見るところ</h2><ul class="check">`;
    (DATA.checklist || []).forEach(c => u += `<li>${esc(c)}</li>`);
    u += `</ul></div>`;

    /* ---------- パネル2 ---------- */
    const A = DATA.after || {};
    let f = `<div class="panel" id="panel-first" role="tabpanel" aria-labelledby="tab-first" hidden>`;
    f += `<p class="lead">${esc(A.intro || "")}</p>`;
    f += `<h2>申請の一覧</h2><ol class="tasks">`;
    (A.items || []).forEach(x => {
      if (!x) return;
      let badge;
      if (!x.at) badge = `<span class="badge">日程未定</span>`;
      else {
        const t = new Date(x.at), left = daysLeft(t);
        badge = t <= now0
          ? `<span class="badge done">終了</span>`
          : `<span class="badge set">あと${left}日</span>`;
      }
      const isWarn = x.note && String(x.note).startsWith("★");
      const checkUrl = x.check && x.check.url;
      const checkName = x.check && x.check.name;
      const pdfUrl = x.pdf && x.pdf.url;
      const pdfName = x.pdf && x.pdf.name;

      f += `<li>
        <div class="tk-head"><span class="tk-name">${esc(x.name || "")}</span>${badge}</div>
        <div class="tk-meta">
          <span class="tk-k">時期</span><span>${esc(x.when || "")}</span>
          <span class="tk-k">方法</span><span>${esc(x.how || "")}</span>
          <span class="tk-k">要るもの</span><span>${(x.need || []).map(n=>esc(n)).join("<br>")}</span>
        </div>
        ${x.note ? `<div class="tk-note${isWarn ? ' is-warn' : ''}">${esc(x.note)}</div>` : ""}`;

      if (checkUrl || pdfName) {
        f += `<div class="tk-files">`;
        if (checkUrl) {
          f += `<div><span class="lbl">確認先</span>
            <a href="${esc(R(checkUrl))}" target="_blank" rel="noopener">${esc(checkName || checkUrl)}</a></div>`;
        }
        if (pdfName) {
          f += pdfUrl
            ? `<div><span class="lbl">PDF</span><a href="${esc(R(pdfUrl))}" target="_blank" rel="noopener">${esc(pdfName)}</a></div>`
            : `<div><span class="lbl">PDF</span><span class="pending">${esc(pdfName)}｜公開待ち（確認先から辿る）</span></div>`;
        }
        f += `</div>`;
      }
      f += `</li>`;
    });
    f += `</ol>`;

    const RULE = A.urlrule || { pattern: "", rows: [], notes: [] };
    f += `<h2>公式サイトのURLの規則</h2>
      <div class="rule-pat">${esc(RULE.pattern || "")}</div>
      <ul class="links">`;
    (RULE.rows || []).forEach(r => {
      f += `<li><code class="rule-k">${esc(r.k || "")}</code>
        <div class="row-note">${esc(r.v || "")}</div></li>`;
    });
    f += `</ul><ul class="check">`;
    (RULE.notes || []).forEach(n => f += `<li>${esc(n)}</li>`);
    f += `</ul></div>`;

    /* ---------- パネル3：当日やること ---------- */
    const O = DATA.onsite || {};
    let o = `<div class="panel" id="panel-onsite" role="tabpanel" aria-labelledby="tab-onsite" hidden>`;
    o += `<p class="lead">${esc(O.intro || "")}</p>`;

    o += `<h2>当日の流れ</h2><ol class="tasks">`;
    (O.flow || []).forEach(x => {
      if (!x) return;
      o += `<li><div class="tk-head"><span class="tk-name">${esc(x.t || "")}</span></div>
        <div class="tk-note">${esc(x.d || "")}</div></li>`;
    });
    o += `</ol>`;

    o += `<h2>紙もの</h2><ol class="tasks">`;
    (O.papers || []).forEach(p => {
      if (!p) return;
      const isWarn = p.how && String(p.how).startsWith("★");
      o += `<li>
        <div class="tk-head"><span class="tk-name">${esc(p.name || "")}</span>
          <span class="badge">${esc(p.when || "")}</span></div>
        ${p.how ? `<div class="tk-note${isWarn ? ' is-warn' : ''}">${esc(p.how)}</div>` : ""}
        <div class="tk-meta"><span class="tk-k">書く欄</span>
          <span>${(p.fill || []).map(x=>esc(x)).join("<br>")}</span></div>
        ${p.note ? `<div class="tk-note">${esc(p.note)}</div>` : ""}</li>`;
    });
    o += `</ol>`;

    const S = O.submit || { yes: [], no: [], note: "" };
    o += `<h2>見本誌に出すもの</h2><ul class="check">`;
    (S.yes || []).forEach(x => o += `<li>${esc(x)}</li>`);
    o += `</ul><h2>出さないもの</h2><ul class="check none">`;
    (S.no || []).forEach(x => o += `<li>${esc(x)}</li>`);
    o += `</ul>${S.note ? `<p class="tk-note" style="margin-top:14px">${esc(S.note)}</p>` : ""}`;

    o += `<h2>持ち物</h2><ul class="check">`;
    (O.bring || []).forEach(x => o += `<li>${esc(x)}</li>`);
    o += `</ul></div>`;

    html += u + f + o;
    html += `<footer>個人用のメモです。コミックマーケット準備会とは関係ありません。
      正確な情報は必ず<a href="https://www.comiket.co.jp/" target="_blank" rel="noopener">公式サイト</a>で確認してください。</footer>`;
    app.innerHTML = html;

    /* ---------- タブ ---------- */
    const tabs = [...document.querySelectorAll('.tab')];
    function select(id, push){
      tabs.forEach(t => {
        const on = t.id === 'tab-' + id;
        t.setAttribute('aria-selected', on);
        const p = document.getElementById(t.getAttribute('aria-controls'));
        if (p) p.hidden = !on;
      });
      if (push) history.replaceState(null, '', '#' + id);
    }
    tabs.forEach(t => {
      t.addEventListener('click', () => select(t.id.replace('tab-',''), true));
      t.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        const i = tabs.indexOf(t);
        const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
        n.focus(); select(n.id.replace('tab-',''), true);
      });
    });
    const h = location.hash.replace('#','');
    select(['first','onsite'].includes(h) ? h : 'usual', false);

    /* ---------- カウントダウン ---------- */
    if (next) {
      const hero = document.getElementById('hero'), num = document.getElementById('cnum');
      const unit = document.getElementById('cunit'), sub = document.getElementById('csub');
      const tick = () => {
        const ms = next.t - new Date();
        if (ms <= 0) { location.reload(); return; }
        const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000);
        const m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
        if (num && unit && sub) {
          if (d >= 1) {
            num.textContent = d; unit.textContent = "日";
            sub.textContent = `残り ${pad(h)}:${pad(m)}:${pad(s)}`;
          } else {
            num.textContent = h; unit.textContent = "時間";
            sub.textContent = `${m}分 ${pad(s)}秒`;
          }
        }
        if (hero) hero.classList.toggle('is-urgent', ms < 3*86400000);
      };
      tick(); setInterval(tick, 1000);
    }
  } catch (err) {
    console.error("Rendering error:", err);
    app.innerHTML = `<div class="disclaimer">
      <b>表示に失敗しました。</b>公式サイトで確認してください：
      <a href="https://www.comiket.co.jp/" target="_blank" rel="noopener">コミックマーケット公式サイト</a>
    </div>`;
  }
})();
</script>
</div>
</body>
</html>

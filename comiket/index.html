<!DOCTYPE html>
<!--
==================================================================
  コミケ サークル参加メモ（個人用・非公式）

  【次の回に切り替えるとき】
  DATA の event.no を変えてください（例: "109" → "110"）。
  リンクの中の {n} が一斉に置き換わります。
  event.name / dates / venue / fee も忘れずに。

  【日程が発表されたら】
  「当選後にやること」の各項目にある at: null を、
  確定した日時に書き換えてください。それだけで
  「締切一覧」タブの一覧とカウントダウンに自動で合流します。

      at: null                            ← 未定（日程未定と表示される）
      at: "2026-12-05T23:59:59+09:00"     ← 確定（あと何日と表示される）

  日時は +09:00（日本時間）を付けます。
  「消印有効」など時刻がないものは、その日の 23:59:59 にします。

  【PDFが公開されたら】
  各項目の pdf: の url を書き換えます。空のままだと「公開待ち」と表示。
  PDFのURLは回ごとに変わりますが、check（確認先）は変わりません。

  タブは URL で切り替わります → #usual / #apply / #first / #onsite
==================================================================
-->

<head>

<style>
/* 2色刷りの印刷物という表現のためダークモードは実装せず、単一の配色に固定する */
:root{
  --paper:#f6eef1;   /* 地。ピンクを極薄で敷いた紙 */
  --card:#fdfbfc;    /* 白場 */
  --ink:#000066;     /* 一色目・藍。本文と枠。paper上 15.45:1 / pink面上 10.07:1 */
  --muted:#45447f;   /* 補助文字。paper上 7.72:1 / pink面上 5.03:1 */
  --pink:#efb4c5;    /* 二色目。面と罫だけに使う。文字色にしない(1.47:1) */
  --hot:#b02348;     /* 緊急のみ。藍とピンクの重ね刷り相当の濃度。paper上 5.79:1 */
  --knock:#ffffff;   /* 藍の面への白抜き。藍面上 17.62:1 */
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  line-height:1.75;
  font-size:15px;
  padding:0 18px 80px;
}
.wrap{max-width:760px;margin:0 auto}
a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid var(--pink);
}
a:hover{border-bottom-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--hot);outline-offset:3px}

.stale{
  background:var(--hot);
  color:var(--knock);
  font-size:13px;
  font-weight:500;
  padding:10px 16px;
  margin:0 -18px;
  text-align:center;
}

.disclaimer{
  border:1px solid var(--hot);
  background:var(--card);
  padding:12px 16px;
  margin-top:24px;
  font-size:12.5px;
  line-height:1.65;
  color:var(--hot);
}
.disclaimer b{font-weight:700}
.disclaimer a{color:var(--hot);border-bottom-color:var(--hot)}

header{padding:40px 0 28px}
h1{
  font-family:"Noto Sans JP",sans-serif;
  font-weight:900;
  letter-spacing:-0.02em;
  font-size:clamp(28px,6vw,40px);
  line-height:1.2;
  margin:8px 0 4px;
  color:var(--ink);
}
.subtitle-main{
  font-family:"Noto Sans JP",sans-serif;
  font-weight:700;
  font-size:15px;
  color:var(--ink);
  margin-bottom:8px;
}
.subtitle{font-size:13.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:12px;color:var(--muted)}
.meta b{font-weight:500;color:var(--ink)}

.tabs{display:flex;border-bottom:2px solid var(--ink);margin-top:32px;align-items:stretch}
.tab{
  font-family:"Noto Sans JP",sans-serif;
  font-size:14.5px;
  font-weight:500;
  background:none;
  cursor:pointer;
  color:var(--muted);
  padding:13px 22px;
  position:relative;
  top:2px;
  line-height:1.4;
  border:1px solid transparent;
  border-bottom:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.tab:hover:not([aria-selected="true"]){color:var(--ink);background:var(--card)}
.tab[aria-selected="true"]{
  color:var(--ink);
  font-weight:700;
  background:var(--pink);
  border-color:var(--ink);
  border-bottom:2px solid var(--pink);
}
.tab-text-short{display:none}
.panel[hidden]{display:none}

.toc{margin-top:24px;scroll-margin-top:16px}
.toc-list{list-style:none;border-top:1px solid var(--pink)}
.toc-list li{border-bottom:1px solid var(--pink);font-size:14.5px}
.toc-list a{
  display:block;
  padding:10px 4px;
  font-weight:700;
  color:var(--ink);
  text-decoration:none;
  border-bottom:none;
}
.toc-list a:hover{color:var(--muted)}

.sec-head{
  font-family:"Noto Sans JP",sans-serif;
  font-size:18px;
  font-weight:900;
  letter-spacing:-0.02em;
  color:var(--ink);
  background:var(--pink);
  margin:40px 0 16px;
  padding:8px 12px;
  scroll-margin-top:16px;
}

.back-to-toc{margin-top:24px;text-align:right;font-size:13px}
.back-to-toc a{color:var(--muted);border-bottom:1px solid var(--pink)}
.back-to-toc a:hover{color:var(--ink);border-bottom-color:var(--ink)}

.hero{
  position:relative;
  background:var(--ink);
  color:var(--knock);
  margin:44px 0 20px;
  padding:32px 28px 28px;
}
.hero.is-urgent{background:var(--hot)}
/* 緊急時は地を重ね刷りの濃色へ差し替える。白抜き 6.60:1 / --paper 5.79:1 */
.hero.is-urgent .hero-label,
.hero.is-urgent .count-sub{color:var(--paper)}
.tombo{position:absolute;width:22px;height:22px;pointer-events:none}
.tombo::before,.tombo::after{content:"";position:absolute}
.tombo::before{left:50%;top:0;bottom:0;width:1px;background:var(--pink)}
.tombo::after{top:50%;left:0;right:0;height:1px;background:var(--ink)}
.tombo.tl{left:-11px;top:-11px}.tombo.tr{right:-11px;top:-11px}
.tombo.bl{left:-11px;bottom:-11px}.tombo.br{right:-11px;bottom:-11px}
.hero-label{
  font-family:"Oswald",sans-serif;
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--pink);
}
.hero-name{
  font-family:"Noto Sans JP",sans-serif;
  font-size:20px;
  font-weight:900;
  letter-spacing:-0.02em;
  margin:6px 0 4px;
  line-height:1.4;
  color:var(--knock);
}
.hero-when{font-size:13px;color:var(--paper)}
.count{display:flex;align-items:baseline;gap:10px;margin-top:20px;flex-wrap:wrap;color:var(--knock)}
.count-num{
  font-family:"Oswald",sans-serif;
  font-weight:600;
  font-size:clamp(64px,17vw,116px);
  line-height:.86;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  color:var(--knock);
}
.is-urgent .count-num{color:var(--knock)}
.count-unit{font-size:20px;font-weight:500;transform:translateY(-6px);color:var(--knock)}
.count-sub{
  font-family:"Oswald",sans-serif;
  font-size:13px;
  letter-spacing:.06em;
  color:var(--pink);
  margin-top:10px;
  font-variant-numeric:tabular-nums;
}
.hero-note{
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--pink);
  font-size:13px;
  color:var(--paper);
}
.hero-note .note-main{color:var(--knock);font-weight:700}
.hero-note .note-sub{color:var(--paper)}

h2{
  font-family:"Noto Sans JP",sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:.04em;
  background:var(--pink);
  color:var(--ink);
  margin:48px 0 16px;
  padding:6px 12px;
}
.lead{font-size:14.5px;margin-top:24px}

.row{
  display:flex;
  gap:16px;
  align-items:flex-start;
  padding:16px 0;
  border-bottom:1px solid var(--pink);
}
.row-date{
  flex:0 0 74px;
  font-family:"Oswald",sans-serif;
  font-size:12px;
  letter-spacing:.04em;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  padding-top:3px;
  line-height:1.5;
}
.row-date b{display:block;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:0}
.row-date b.undec{display:inline-block;font-size:12px;font-weight:400;color:var(--muted)}
.row-body{flex:1 1 auto;min-width:0}
.row-name{
  font-family:"Noto Sans JP",sans-serif;
  font-weight:900;
  letter-spacing:-0.02em;
  font-size:15px;
  line-height:1.5;
  color:var(--ink);
}
.row-note{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.row-left{
  flex:0 0 auto;
  text-align:right;
  font-family:"Oswald",sans-serif;
  font-size:12px;
  letter-spacing:.05em;
  color:var(--muted);
  padding-top:5px;
  font-variant-numeric:tabular-nums;
}
.row-left b{font-size:22px;font-weight:600;color:var(--ink);display:block;line-height:1.1}
.row.urgent .row-left b,.row.urgent .row-date b{color:var(--hot)}
.row.done .row-name{
  color:var(--muted);
  /* deslop-ignore-next-line 09: 終了した締切の取り消し。装飾ではなく状態表示 */
  text-decoration:line-through;
  text-decoration-thickness:1px;
}
.row.done .row-date b{color:var(--muted)}
.stampmark{
  flex:0 0 auto;
  width:54px;
  height:54px;
  color:var(--ink);
  transform:rotate(-11deg);
  align-self:center;
}
@media(prefers-reduced-motion:no-preference){
  .stampmark{animation:press .5s cubic-bezier(.2,.9,.3,1) both}}
@keyframes press{from{transform:rotate(-11deg) scale(1.5)}
  to{transform:rotate(-11deg) scale(1)}}

.links{list-style:none}
.links li{padding:14px 0;border-bottom:1px solid var(--pink);font-size:14.5px}
.links li a{font-weight:700}
.host{
  font-family:"Oswald",sans-serif;
  font-size:11px;
  letter-spacing:.09em;
  color:var(--muted);
  margin-top:3px;
}
.check{list-style:none;font-size:14px}
.check li{
  padding:10px 0 10px 26px;
  position:relative;
  border-bottom:1px dotted var(--pink);
  color:var(--ink);
}
.check li::before{
  content:"";
  position:absolute;
  left:0;
  top:16px;
  width:12px;
  height:12px;
  border:1px solid var(--ink);
  background:var(--card);
}

/* 当選後にやること */
.tasks{list-style:none;counter-reset:tk}
.tasks li{
  counter-increment:tk;
  position:relative;
  padding:22px 0 22px 52px;
  border-bottom:1px solid var(--pink);
}
.tasks li::before{
  content:counter(tk,decimal-leading-zero);
  position:absolute;
  left:0;
  top:23px;
  font-family:"Oswald",sans-serif;
  font-size:22px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:-.02em;
}
.tk-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tk-name{
  font-family:"Noto Sans JP",sans-serif;
  font-weight:900;
  letter-spacing:-0.02em;
  font-size:16px;
  line-height:1.5;
  color:var(--ink);
}
.badge{
  font-family:"Oswald",sans-serif;
  font-size:11px;
  letter-spacing:.1em;
  padding:2px 8px;
  border:1px solid var(--muted);
  color:var(--muted);
  background:var(--card);
  white-space:nowrap;
}
.badge.set{border-color:var(--ink);color:var(--ink);font-weight:600}
/* deslop-ignore-next-line 09: 終了した締切の取り消し。装飾ではなく状態表示 */
.badge.done{color:var(--muted);text-decoration:line-through}
.tk-meta{
  display:grid;
  grid-template-columns:68px 1fr;
  gap:6px 12px;
  margin:12px 0;
  font-size:13px;
  line-height:1.65;
  color:var(--ink);
}
.tk-k{
  font-family:"Oswald",sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--muted);
  padding-top:3px;
}
.tk-note{font-size:13.5px;color:var(--muted);line-height:1.8;margin-top:6px}
.note-main{
  font-family:"Noto Sans JP",sans-serif;
  font-weight:700;
  color:var(--ink);
  display:block;
  margin-bottom:2px;
}
.note-sub{display:block;font-size:12.5px;color:var(--muted)}
.tk-files{margin-top:12px;padding-top:10px;border-top:1px dotted var(--pink);font-size:13px}
.tk-files div{margin-top:4px}
.tk-files .lbl{
  font-family:"Oswald",sans-serif;
  font-size:10.5px;
  letter-spacing:.12em;
  color:var(--muted);
  margin-right:8px;
}
.pending{color:var(--muted);font-size:12.5px}

.row-src{margin-top:4px}
.row-src a{
  font-family:"Oswald",sans-serif;
  font-size:11px;
  letter-spacing:.1em;
  color:var(--muted);
  border-bottom:1px solid var(--pink);
}
.row-src a:hover{color:var(--ink);border-bottom-color:var(--ink)}

.pending-row{border-bottom-style:dashed}
.pending-row .row-name{font-weight:500;color:var(--muted)}
.undec{
  font-family:"Noto Sans JP",sans-serif;
  font-size:12px;
  font-weight:400;
  letter-spacing:.1em;
  color:var(--muted);
  border:1px solid var(--pink);
  padding:1px 7px;
  display:inline-block;
  background:var(--card);
}

.check.none li::before{border-style:dashed;border-color:var(--muted)}
.check.none li{color:var(--muted)}

.rule-pat{
  background:var(--card);
  border:1px solid var(--pink);
  padding:12px 16px;
  font-family:"Oswald",sans-serif;
  font-size:13.5px;
  letter-spacing:.04em;
  word-break:break-all;
  margin-bottom:8px;
  color:var(--ink);
}
.rule-k{
  font-family:"Oswald",sans-serif;
  font-size:13.5px;
  letter-spacing:.03em;
  color:var(--hot);
  font-weight:600;
}

.admin-details{
  margin-top:36px;
  background:var(--card);
  border:1px solid var(--pink);
  padding:14px 16px;
}
.admin-details summary{
  font-family:"Noto Sans JP",sans-serif;
  font-size:13.5px;
  font-weight:700;
  color:var(--ink);
  cursor:pointer;
}
.admin-details summary:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.admin-details[open] summary{
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:1px solid var(--pink);
}

footer{
  margin-top:64px;
  padding-top:24px;
  border-top:2px solid var(--ink);
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
}

@media(min-width:640px){
  .toc,.sec-head,.back-to-toc{display:none}
}
@media(max-width:639px){
  .tabs{display:none}
}
@media(max-width:520px){
  .row{flex-wrap:wrap;gap:10px}
  .row-date{flex-basis:100%;display:flex;align-items:baseline;gap:8px}
  .row-date b{display:inline}
  .row-body{flex-basis:100%;order:3}
  .row-left{order:2;margin-left:auto}
  .stampmark{order:4;width:44px;height:44px}
  .tasks li{padding-left:40px}
}
</style>
</head>

<script>

    const stampSVG = `<svg class="stampmark" viewBox="0 0 100 100" aria-hidden="true">
      <!-- deslop-ignore-next-line 24: 判子（済スタンプ）の意匠。汎用アイコンではない -->
      <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"/>
      <!-- deslop-ignore-next-line 24: 判子（済スタンプ）の意匠。汎用アイコンではない -->
      <circle cx="50" cy="50" r="39" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="50" y="59" text-anchor="middle" font-family="'Noto Sans JP',sans-serif"
            font-size="28" font-weight="900" fill="currentColor">終了</text></svg>`;

    const formatNote = (noteText, className) => {
      if (!noteText) return "";
      const s = String(noteText);
      const cls = className ? ` class="${esc(className)}"` : "";
      if (s.startsWith("★")) {
        const clean = s.slice(1).trim();
        const periodIdx = clean.indexOf("。");
        if (periodIdx !== -1) {
          const main = clean.slice(0, periodIdx + 1);
          const rest = clean.slice(periodIdx + 1).trim();
          return `<div${cls}><span class="note-main">${esc(main)}</span>${rest ? `<span class="note-sub">${esc(rest)}</span>` : ""}</div>`;
        } else {
          return `<div${cls}><span class="note-main">${esc(clean)}</span></div>`;
        }
      }
      return `<div${cls}>${esc(s)}</div>`;
    };

    const renderLinks = targetTab => {
      const groups = [];
      (DATA.links || []).forEach(l => {
        if (!l) return;
        const tabs = Array.isArray(l.tab) ? l.tab : [l.tab || "apply"];
        if (!tabs.includes(targetTab)) return;
        const g = l.group || "リンク";
        let x = groups.find(y => y.name === g);
        if (!x) { x = { name: g, items: [] }; groups.push(x); }
        x.items.push(l);
      });
      let res = "";
      groups.forEach(g => {
        if (!g.items.length) return;
        res += `<h2>${esc(g.name)}</h2><ul class="links">`;
        g.items.forEach(l => {
          const host = getHost(l.url);
          res += `<li>
            <a href="${esc(R(l.url))}" target="_blank" rel="noopener">${esc(l.name)}</a>
            ${l.note ? formatNote(l.note, "row-note") : ""}
            ${host ? `<div class="host">${esc(host)}</div>` : ""}</li>`;
        });
        res += `</ul>`;
      });
      return res;
    };

    /* opts.noPendingBadge: 締切が別の場所（締切一覧）にある工程で「日程未定」を出さない */
    const renderTasks = (items, h2Title, opts) => {
      const noPending = !!(opts && opts.noPendingBadge);
      let res = "";
      if (h2Title) res += `<h2>${esc(h2Title)}</h2>`;
      res += `<ol class="tasks">`;
      (items || []).forEach(x => {
        if (!x) return;
        let badge;
        if (!x.at) badge = noPending ? "" : `<span class="badge">日程未定</span>`;
        else {
          const t = new Date(x.at), left = daysLeft(t);
          badge = t <= now0
            ? `<span class="badge done">終了</span>`
            : `<span class="badge set">あと${left}日</span>`;
        }
        const checkUrl = x.check && x.check.url;
        const checkName = x.check && x.check.name;
        const pdfUrl = x.pdf && x.pdf.url;
        const pdfName = x.pdf && x.pdf.name;

        res += `<li>
          <div class="tk-head"><span class="tk-name">${esc(x.name || "")}</span>${badge}</div>
          <div class="tk-meta">
            <span class="tk-k">時期</span><span>${esc(x.when || "")}</span>
            <span class="tk-k">方法</span><span>${esc(x.how || "")}</span>
            <span class="tk-k">要るもの</span><span>${(x.need || []).map(n=>esc(n)).join("<br>")}</span>
          </div>
          ${x.note ? formatNote(x.note, "tk-note") : ""}`;

        if (checkUrl || pdfName) {
          res += `<div class="tk-files">`;
          if (checkUrl) {
            res += `<div><span class="lbl">確認先</span>
              <a href="${esc(R(checkUrl))}" target="_blank" rel="noopener">${esc(checkName || checkUrl)}</a></div>`;
          }
          if (pdfName) {
            res += pdfUrl
              ? `<div><span class="lbl">PDF</span><a href="${esc(R(pdfUrl))}" target="_blank" rel="noopener">${esc(pdfName)}</a></div>`
              : `<div><span class="lbl">PDF</span><span class="pending">${esc(pdfName)}｜公開待ち（確認先から辿る）</span></div>`;
          }
          res += `</div>`;
        }
        res += `</li>`;
      });
      res += `</ol>`;
      return res;
    };

    /* ---------- ヘッダー ---------- */
    let html = "";
    const daysOld = Math.floor((now0 - new Date(DATA.updated)) / 86400000);
    if (!next) html += `<div class="stale">全ての日程が過ぎています。次回の情報に更新してください</div>`;
    else if (daysOld > 120) html += `<div class="stale">最終更新から${daysOld}日経過。公式ページで締切を確認してください</div>`;

    html += `<header>
      <h1>${esc(DATA.title)}</h1>
      <div class="subtitle-main">コミケ参加・手続き進行表</div>
      <div class="subtitle"><b>${esc(DATA.event && DATA.event.name)}</b>　${esc(DATA.event && DATA.event.dates)}</div>
      <div class="meta">
        <span>会場 <b>${esc(DATA.event && DATA.event.venue)}</b></span>
        <span>参加費 <b>${esc(DATA.event && DATA.event.fee)}</b></span>
        <span>データ更新 <b>${esc(DATA.updated)}</b></span>
      </div>
      <div class="disclaimer">
        <b>非公式の個人メモです。</b>コミックマーケット準備会とは関係ありません。
        日付は手作業で転記したもので、誤りが含まれる可能性があります。
        申し込む前に必ず<a href="https://www.comiket.co.jp/" target="_blank" rel="noopener">公式サイト</a>で確認してください。
      </div>
      <nav class="toc" id="toc" aria-label="目次">
        <ul class="toc-list">
          <li><a href="#usual">締切一覧</a></li>
          <li><a href="#apply">申込みでやること</a></li>
          <li><a href="#first">当選後にやること</a></li>
          <li><a href="#onsite">当日やること</a></li>
        </ul>
      </nav>
    </header>`;

    html += `<div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-usual" aria-controls="panel-usual" aria-selected="true"><span class="tab-text-full">締切一覧</span><span class="tab-text-short">締切一覧</span></button>
      <button class="tab" role="tab" id="tab-apply" aria-controls="panel-apply" aria-selected="false" aria-label="申込みでやること"><span class="tab-text-full">申込みでやること</span><span class="tab-text-short">申込み</span></button>
      <button class="tab" role="tab" id="tab-first" aria-controls="panel-first" aria-selected="false" aria-label="当選後にやること"><span class="tab-text-full">当選後にやること</span><span class="tab-text-short">当選後</span></button>
      <button class="tab" role="tab" id="tab-onsite" aria-controls="panel-onsite" aria-selected="false" aria-label="当日やること"><span class="tab-text-full">当日やること</span><span class="tab-text-short">当日</span></button>
    </div>`;

    /* ---------- パネル1：締切一覧 ---------- */
    let u = `<div class="panel" id="panel-usual" role="tabpanel" aria-labelledby="tab-usual">`;
    u += `<h2 class="sec-head" id="usual">締切一覧</h2>`;
    if (next) {
      u += `<section class="hero" id="hero">
        <span class="tombo tl"></span><span class="tombo tr"></span>
        <span class="tombo bl"></span><span class="tombo br"></span>
        <div class="hero-label">Next deadline</div>
        <div class="hero-name">${esc(next.name)}</div>
        <div class="hero-when">${fmtFull(next.t)}</div>
        <div class="count"><span class="count-num" id="cnum">–</span><span class="count-unit" id="cunit">日</span></div>
        <div class="count-sub" id="csub"></div>
        ${next.note ? formatNote(next.note, "hero-note") : ""}
      </section>`;
    } else {
      u += `<section class="hero">
        <span class="tombo tl"></span><span class="tombo tr"></span>
        <span class="tombo bl"></span><span class="tombo br"></span>
        <div class="hero-label">Next deadline</div>
        <div class="hero-name">予定なし</div>
        <div class="hero-when">次回の日程が発表されたら DATA を書き換えてください</div>
      </section>`;
    }

    u += `<h2>すべての日程</h2>`;

    const rows = items.map(i => {
      const past = i.t <= now0, left = daysLeft(i.t), urgent = !past && left <= 3;
      return `<div class="row ${past?'done':''} ${urgent?'urgent':''}">
        <div class="row-date"><b>${fmtDate(i.t)}</b>${pad(i.t.getHours())}:${pad(i.t.getMinutes())}</div>
        <div class="row-body"><div class="row-name">${esc(i.name)}</div>
          ${i.note ? formatNote(i.note, "row-note") : ""}
          ${i.src ? `<div class="row-src"><a href="${esc(R(i.src))}" target="_blank" rel="noopener">出典を見る</a></div>` : ""}</div>
        ${past ? stampSVG : `<div class="row-left"><b>${left}</b>日</div>`}
      </div>`;
    });

    /* 日程が未定の申請も、申込の締切と開催日のあいだに並べる。
       at が入った時点で上の rows 側に移り、日付順に整列する。 */
    const pendingRows = ((DATA.after && DATA.after.items) || [])
      .filter(x => x && !x.at)
      .map(x => `
      <div class="row pending-row">
        <div class="row-date"><b class="undec">未定</b></div>
        <div class="row-body">
          <div class="row-name">${esc(x.name)}</div>
          <div class="row-note">${esc(x.when)}</div>
          ${(x.check && x.check.url) ? `<div class="row-src">
            <a href="${esc(R(x.check.url))}" target="_blank" rel="noopener">確認先を見る</a></div>` : ""}
        </div>
        <div class="row-left"></div>
      </div>`);

    if (pendingRows.length) {
      let at = items.findIndex(i => i.kind === "event");
      if (at < 0) at = rows.length;
      rows.splice(at, 0, ...pendingRows);
    }
    u += rows.join("");
    u += `<div class="back-to-toc"><a href="#toc">↑ 目次へ戻る</a></div>`;
    u += `</div>`;

    /* ---------- パネル2：申込みでやること ---------- */
    const AP = DATA.apply || {};
    let ap = `<div class="panel" id="panel-apply" role="tabpanel" aria-labelledby="tab-apply" hidden>`;
    ap += `<h2 class="sec-head" id="apply">申込みでやること</h2>`;
    if (AP.intro) ap += `<p class="lead">${esc(AP.intro)}</p>`;
    ap += renderTasks(AP.items || [], "作業の一覧", { noPendingBadge: true });
    ap += renderLinks("apply");
    ap += `<h2>ログインに要るもの</h2><ul class="check">`;
    (DATA.keys || []).forEach(k => ap += `<li>${esc(k)}</li>`);
    ap += `</ul>`;
    ap += `<details class="admin-details"><summary>更新するとき見るところ（管理用）</summary><ul class="check">`;
    (DATA.checklist || []).forEach(c => ap += `<li>${esc(c)}</li>`);
    ap += `</ul></details>`;
    ap += `<div class="back-to-toc"><a href="#toc">↑ 目次へ戻る</a></div>`;
    ap += `</div>`;

    /* ---------- パネル3：当選後にやること ---------- */
    const A = DATA.after || {};
    let f = `<div class="panel" id="panel-first" role="tabpanel" aria-labelledby="tab-first" hidden>`;
    f += `<h2 class="sec-head" id="first">当選後にやること</h2>`;
    if (A.intro) f += `<p class="lead">${esc(A.intro)}</p>`;
    f += renderTasks(A.items || [], "申請の一覧");

    const RULE = A.urlrule || { pattern: "", rows: [], notes: [] };
    f += `<details class="admin-details"><summary>公式サイトのURLの規則（管理用）</summary>
      <div class="rule-pat">${esc(RULE.pattern || "")}</div>
      <ul class="links">`;
    (RULE.rows || []).forEach(r => {
      f += `<li><code class="rule-k">${esc(r.k || "")}</code>
        ${r.v ? formatNote(r.v, "row-note") : ""}</li>`;
    });
    f += `</ul><ul class="check">`;
    (RULE.notes || []).forEach(n => f += `<li>${esc(n)}</li>`);
    f += `</ul></details>`;
    f += renderLinks("after");
    f += `<div class="back-to-toc"><a href="#toc">↑ 目次へ戻る</a></div>`;
    f += `</div>`;

    /* ---------- パネル4：当日やること ---------- */
    const O = DATA.onsite || {};
    let o = `<div class="panel" id="panel-onsite" role="tabpanel" aria-labelledby="tab-onsite" hidden>`;
    o += `<h2 class="sec-head" id="onsite">当日やること</h2>`;
    if (O.intro) o += `<p class="lead">${esc(O.intro)}</p>`;

    o += `<h2>当日の流れ</h2><ol class="tasks">`;
    (O.flow || []).forEach(x => {
      if (!x) return;
      o += `<li><div class="tk-head"><span class="tk-name">${esc(x.t || "")}</span></div>
        ${x.d ? formatNote(x.d, "tk-note") : ""}</li>`;
    });
    o += `</ol>`;

    o += `<h2>紙もの</h2><ol class="tasks">`;
    (O.papers || []).forEach(p => {
      if (!p) return;
      o += `<li>
        <div class="tk-head"><span class="tk-name">${esc(p.name || "")}</span>
          <span class="badge">${esc(p.when || "")}</span></div>
        ${p.how ? formatNote(p.how, "tk-note") : ""}
        <div class="tk-meta"><span class="tk-k">書く欄</span>
          <span>${(p.fill || []).map(x=>esc(x)).join("<br>")}</span></div>
        ${p.note ? formatNote(p.note, "tk-note") : ""}</li>`;
    });
    o += `</ol>`;

    const S = O.submit || { yes: [], no: [], note: "" };
    o += `<h2>見本誌に出すもの</h2><ul class="check">`;
    (S.yes || []).forEach(x => o += `<li>${esc(x)}</li>`);
    o += `</ul><h2>出さないもの</h2><ul class="check none">`;
    (S.no || []).forEach(x => o += `<li>${esc(x)}</li>`);
    o += `</ul>${S.note ? formatNote(S.note, "tk-note") : ""}`;

    o += `<h2>持ち物</h2><ul class="check">`;
    (O.bring || []).forEach(x => o += `<li>${esc(x)}</li>`);
    o += `</ul>`;
    o += renderLinks("onsite");
    o += `<div class="back-to-toc"><a href="#toc">↑ 目次へ戻る</a></div>`;
    o += `</div>`;

    html += u + ap + f + o;
    html += `<footer>個人用のメモです。コミックマーケット準備会とは関係ありません。
      正確な情報は必ず<a href="https://www.comiket.co.jp/" target="_blank" rel="noopener">公式サイト</a>で確認してください。</footer>`;
    app.innerHTML = html;

    /* ---------- ナビゲーション（タブ / 一覧モード切り替え） ---------- */
    const mqDesktop = window.matchMedia("(min-width: 640px)");
    const tabsContainer = document.querySelector('.tabs');
    const tabs = [...document.querySelectorAll('.tab')];
    const panels = [...document.querySelectorAll('.panel')];
    const toc = document.getElementById('toc');
    const validTabs = ['usual', 'apply', 'first', 'onsite'];

    let currentTab = validTabs.includes(location.hash.replace('#', ''))
      ? location.hash.replace('#', '')
      : 'usual';

    function setMode() {
      if (mqDesktop.matches) {
        /* タブモード（PC・タブレット） */
        if (tabsContainer) {
          tabsContainer.setAttribute('role', 'tablist');
          tabsContainer.hidden = false;
        }
        tabs.forEach(t => {
          const key = t.id.replace('tab-', '');
          t.setAttribute('role', 'tab');
          t.setAttribute('aria-controls', 'panel-' + key);
          t.setAttribute('aria-selected', key === currentTab ? 'true' : 'false');
        });
        panels.forEach(p => {
          const key = p.id.replace('panel-', '');
          p.setAttribute('role', 'tabpanel');
          p.setAttribute('aria-labelledby', 'tab-' + key);
          p.hidden = (key !== currentTab);
        });
        if (toc) toc.hidden = true;
      } else {
        /* 一覧モード（スマホ） */
        if (tabsContainer) {
          tabsContainer.removeAttribute('role');
          tabsContainer.hidden = true;
        }
        tabs.forEach(t => {
          t.removeAttribute('role');
          t.removeAttribute('aria-controls');
          t.removeAttribute('aria-selected');
        });
        panels.forEach(p => {
          p.removeAttribute('role');
          p.removeAttribute('aria-labelledby');
          p.hidden = false;
        });
        if (toc) toc.hidden = false;
      }
    }

    function select(id, push) {
      if (!validTabs.includes(id)) return;
      currentTab = id;
      if (mqDesktop.matches) {
        tabs.forEach(t => {
          const on = t.id === 'tab-' + id;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          const p = document.getElementById('panel-' + t.id.replace('tab-', ''));
          if (p) p.hidden = !on;
        });
      }
      if (push) history.replaceState(null, '', '#' + id);
    }

    tabs.forEach(t => {
      t.addEventListener('click', () => select(t.id.replace('tab-', ''), true));
      t.addEventListener('keydown', e => {
        if (!mqDesktop.matches) return;
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        const i = tabs.indexOf(t);
        const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
        n.focus();
        select(n.id.replace('tab-', ''), true);
      });
    });

    mqDesktop.addEventListener('change', () => {
      const h = location.hash.replace('#', '');
      if (validTabs.includes(h)) currentTab = h;
      setMode();
    });

    window.addEventListener('hashchange', () => {
      const h = location.hash.replace('#', '');
      if (validTabs.includes(h)) {
        currentTab = h;
        if (mqDesktop.matches) {
          select(h, false);
        }
      }
    });

    /* 初期状態の適用 */
    setMode();
    if (!mqDesktop.matches) {
      const initHash = location.hash.replace('#', '');
      if (validTabs.includes(initHash)) {
        const el = document.getElementById(initHash);
        if (el) el.scrollIntoView();
      }
    }

    /* ---------- カウントダウン ---------- */
    if (next) {
      const hero = document.getElementById('hero'), num = document.getElementById('cnum');
      const unit = document.getElementById('cunit'), sub = document.getElementById('csub');
      const tick = () => {
        const ms = next.t - new Date();
        if (ms <= 0) { location.reload(); return; }
        const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000);
        const m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
        if (num && unit && sub) {
          if (d >= 1) {
            num.textContent = d; unit.textContent = "日";
            sub.textContent = `残り ${pad(h)}:${pad(m)}:${pad(s)}`;
          } else {
            num.textContent = h; unit.textContent = "時間";
            sub.textContent = `${m}分 ${pad(s)}秒`;
          }
        }
        if (hero) hero.classList.toggle('is-urgent', ms < 3*86400000);
      };
      tick(); setInterval(tick, 1000);
    }
  } catch (err) {
    console.error("Rendering error:", err);
    app.innerHTML = `<div class="disclaimer">
      <b>表示に失敗しました。</b>公式サイトで確認してください：
      <a href="https://www.comiket.co.jp/" target="_blank" rel="noopener">コミックマーケット公式サイト</a>
    </div>`;
  }
})();
</script>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>404 Not Found - ad-motsu pages</title>
<style>
:root {
  --bg: #fbfbfa;
  --card-bg: #ffffff;
  --ink: #18181b;
  --muted: #52525b;
  --rule: #e4e4e7;
  --link: #1d4ed8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214;
    --card-bg: #18181b;
    --ink: #f4f4f5;
    --muted: #a1a1aa;
    --rule: #27272a;
    --link: #60a5fa;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans JP", sans-serif;
  color: var(--ink);
  background-color: var(--bg);
  line-height: 1.6;
  font-size: 15px;
  padding: 0 20px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.wrap {
  max-width: 520px;
  width: 100%;
  text-align: center;
  padding: 40px 24px;
  background: var(--card-bg);
  border: 1px solid var(--rule);
  border-radius: 8px;
}

.code {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--ink);
}

h1 {
  font-size: 18px;
  font-weight: 600;
  margin-top: 12px;
}

p {
  margin-top: 10px;
  font-size: 14px;
  color: var(--muted);
}

.actions {
  margin-top: 24px;
}

a.btn {
  display: inline-block;
  background: var(--ink);
  color: var(--bg);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 8px 18px;
  border-radius: 6px;
  transition: opacity 0.15s ease;
}

a.btn:hover {
  opacity: 0.85;
}

a.btn:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 3px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>指定されたURLのページは存在しないか、移動した可能性があります。</p>
  <div class="actions">
    <a href="/" class="btn">ポータルへ戻る</a>
  </div>
</div>
</body>
</html>
